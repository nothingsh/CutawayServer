name: Feature request
description: Suggest something CutawayServer should capture or do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Roadmap](https://nothingsh.github.io/Cutaway/resources/roadmap) first; your idea
        may already be planned.
        Features that need new messages or fields also need a change to the Cutaway protocol.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to inspect or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like CutawayServer to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
