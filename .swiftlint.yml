# SwiftLint configuration (S-REL-04). The version is pinned in scripts/SWIFTLINT_VERSION and
# installed by scripts/get-swiftlint.sh; scripts/verify.sh runs it with --strict, so warnings
# fail too. Tests/.swiftlint.yml relaxes some rules for the tests.
#
# Layout (indentation, spacing, wrapping) belongs to SwiftFormat (.swiftformat); the rules here
# that also concern layout agree with it.

included:
  - Package.swift
  - Sources
  - Tests
  - Demo
  - scripts
excluded:
  - Sources/CutawayFlatBuffers
  - Sources/CutawayWire/Generated

disabled_rules:
  - todo

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - force_unwrapping
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - operator_usage_whitespace
  - override_in_extension
  - pattern_matching_keywords
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - prefixed_toplevel_constant
  - prohibited_interface_builder
  - quick_discouraged_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - strong_iboutlet
  - trailing_comma
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

nesting:
  type_level:
    warning: 4

identifier_name:
  excluded:
    - id
    - x
    - y
    - i
    - to
    - en
    - os
    - on
    - ok # Mirrors the protocol's status names (DetailStatus.ok is Ok).
  min_length:
    error: 1

empty_count:
  only_after_dot: true
  severity: warning

type_name:
  excluded:
    - C

function_parameter_count:
  warning: 6

cyclomatic_complexity:
  ignores_case_statements: true
  warning: 12
  error: 15

large_tuple:
  warning: 3

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  # The reference configuration's ignores_strings does not exist in this version; these two are
  # the nearest: long messages stay on one line, where they can be searched for.
  ignores_interpolated_strings: true
  ignores_multiline_strings: true

function_body_length:
  warning: 80
  error: 100

type_body_length:
  warning: 500
  error: 550

file_length:
  warning: 800
  error: 1000

trailing_whitespace:
  ignores_empty_lines: true

custom_rules:
  function_call_trailing_comma:
    name: "Function Call Trailing Comma"
    regex: ',\s*\n\s*\)'
    message: "Trailing comma in function call is not allowed"
    severity: error

# Run by `swiftlint analyze` with a compiler log only: the "SwiftLint analyzer" step of
# scripts/verify.sh, over the iOS build of CutawayServer and CutawayWire.
analyzer_rules:
  - unused_declaration
  - unused_import

unused_import:
  severity: warning

unused_declaration:
  severity: warning
